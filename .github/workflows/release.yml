name: Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: install frontend deps
        run: npm --prefix frontend ci

      - name: lint and check
        env:
          CGO_ENABLED: 0
        run: |
          npm --prefix frontend run check
          npm --prefix frontend run build
          go vet ./...

      - name: run tests
        env:
          CGO_ENABLED: 0
        run: |
          go test -count=1 ./internal/...
          npm --prefix frontend test

      - name: setup nsis
        uses: nsis-dev/setup-nsis@v1

      - name: install wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1

      - name: build app and installer
        env:
          CGO_ENABLED: 0
        run: wails build -platform windows/amd64 -nsis -ldflags "-s -w -X mila/internal/version.Version=${{ github.ref_name }} -extldflags '-static'"

      - name: package portable zip
        run: |
          $exe = Get-ChildItem -Path build/bin -Filter "*.exe" | Where-Object { $_.Name -notmatch "installer" } | Select-Object -First 1
          Compress-Archive -Path $exe.FullName -DestinationPath "build/bin/Mila-windows-amd64-${{ github.ref_name }}.zip"

      - name: generate checksums
        run: |
          $files = Get-ChildItem -Path build/bin -File | Where-Object { $_.Extension -in '.exe', '.zip' }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -Path $file.FullName).Hash.ToLower()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -Path build/bin/SHA256SUMS.txt -Encoding ascii
          Get-Content build/bin/SHA256SUMS.txt

      - name: publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $files = Get-ChildItem -Path build/bin -File | Select-Object -ExpandProperty FullName
          $tagNotes = (git tag -l --format='%(contents)' $tag) -join "`n"
          if (-not [string]::IsNullOrWhiteSpace($tagNotes) -and $tagNotes -match '(?m)^-\s') {
            $notesFile = Join-Path $env:RUNNER_TEMP "release-notes.md"
            $tagNotes.Trim() | Set-Content -Path $notesFile -Encoding UTF8
            gh release create $tag $files --notes-file $notesFile --title "Mila $tag" 2>$null
          } else {
            $prevTag = (git tag --sort=-v:refname | Where-Object { $_ -ne $tag } | Select-Object -First 1)
            $commits = if ($prevTag) { git log "$prevTag..$tag" --no-merges --pretty=format:"- %s" } else { git log -n 10 --no-merges --pretty=format:"- %s" }
            $notes = ($commits -join "`n").Trim()
            if ($prevTag) {
              $notes = "$notes`n`n**Full Changelog:** https://github.com/mila-desktop/desktop/compare/$prevTag...$tag"
            }
            $notesFile = Join-Path $env:RUNNER_TEMP "release-notes.md"
            $notes | Set-Content -Path $notesFile -Encoding UTF8
            gh release create $tag $files --notes-file $notesFile --title "Mila $tag" 2>$null
          }
          if ($LASTEXITCODE -ne 0) {
            gh release upload $tag $files --clobber
          }
