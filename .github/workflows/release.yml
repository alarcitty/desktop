name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: install frontend deps
        run: npm --prefix frontend ci

      - name: lint and check
        run: |
          npm --prefix frontend run check
          npm --prefix frontend run build
          go vet ./...

      - name: run tests
        run: |
          go test -count=1 ./internal/...
          npm --prefix frontend test

      - name: install nsis
        run: choco install nsis -y

      - name: install wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1

      - name: build app
        run: wails build -platform windows/amd64 -nsis

      - name: package portable zip
        run: Compress-Archive -Path build/bin/mila.exe -DestinationPath "build/bin/mila-windows-amd64-${{ github.ref_name }}.zip"

      - name: create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = Get-ChildItem -Path build/bin -File | Select-Object -ExpandProperty FullName
          gh release create ${{ github.ref_name }} $files --generate-notes --title "mila ${{ github.ref_name }}"
