name: Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: install frontend deps
        run: npm --prefix frontend ci

      - name: lint and check
        env:
          CGO_ENABLED: 0
        run: |
          npm --prefix frontend run check
          npm --prefix frontend run build
          go vet ./...

      - name: run tests
        env:
          CGO_ENABLED: 0
        run: |
          go test -count=1 ./internal/...
          npm --prefix frontend test

      - name: setup nsis
        uses: nsis-dev/setup-nsis@v1

      - name: install wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1

      - name: sync wails productVersion with release tag
        run: |
          $raw = "${{ github.ref_name }}" -replace '^v', ''
          $parts = $raw.Split('.')
          while ($parts.Count -lt 4) { $parts += '0' }
          $ver4 = ($parts[0..3] -join '.')
          $wailsJson = Get-Content wails.json -Raw | ConvertFrom-Json
          $wailsJson.info.productVersion = $ver4
          ($wailsJson | ConvertTo-Json -Depth 10) | Set-Content wails.json -Encoding UTF8

      - name: build app and installer
        env:
          CGO_ENABLED: 0
          GOAMD64: v2
        run: wails build -platform windows/amd64 -nsis -installscope user -webview2 browser -trimpath -ldflags "-X mila/internal/version.Version=${{ github.ref_name }}"

      - name: sign windows executables (Authenticode SHA-256)
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $signtool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter "signtool.exe" -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName

          if (-not $signtool) {
            Write-Host "signtool.exe not found, skipping signing"
            exit 0
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP "mila-codesign.pfx"
          $pfxPass = if ($env:WINDOWS_CERT_PASSWORD) { $env:WINDOWS_CERT_PASSWORD } else { "MilaCodeSignTemp!2026" }

          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_PFX_BASE64)) {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          } else {
            $securePass = ConvertTo-SecureString -String $pfxPass -Force -AsPlainText
            $cert = New-SelfSignedCertificate `
              -Type CodeSigningCert `
              -Subject "CN=Mila Desktop, O=Mila Desktop, C=US" `
              -KeyAlgorithm RSA `
              -KeyLength 2048 `
              -HashAlgorithm SHA256 `
              -CertStoreLocation "Cert:\CurrentUser\My" `
              -NotAfter (Get-Date).AddYears(3)
            Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password $securePass | Out-Null
          }

          $appExe = Resolve-Path "build/bin/Mila.exe"
          & $signtool sign /f $pfxPath /p $pfxPass /fd SHA256 /td SHA256 /tr "http://timestamp.digicert.com" /d "Mila Desktop" $appExe

          Push-Location "build/windows/installer"
          makensis "-DARG_WAILS_AMD64_BINARY=..\..\bin\Mila.exe" "-DWAILS_INSTALL_SCOPE=user" "-DREQUEST_EXECUTION_LEVEL=user" project.nsi
          Pop-Location

          $instExe = Resolve-Path "build/bin/Mila-amd64-installer.exe"
          & $signtool sign /f $pfxPath /p $pfxPass /fd SHA256 /td SHA256 /tr "http://timestamp.digicert.com" /d "Mila Desktop Setup" $instExe
          Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue

      - name: package portable zip
        run: |
          $exe = Get-ChildItem -Path build/bin -Filter "*.exe" | Where-Object { $_.Name -notmatch "installer" } | Select-Object -First 1
          Compress-Archive -Path $exe.FullName -DestinationPath "build/bin/Mila-windows-amd64-${{ github.ref_name }}.zip"

      - name: generate checksums
        run: |
          $files = Get-ChildItem -Path build/bin -File | Where-Object { $_.Extension -in '.exe', '.zip' }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -Path $file.FullName).Hash.ToLower()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -Path build/bin/SHA256SUMS.txt -Encoding ascii
          Get-Content build/bin/SHA256SUMS.txt

      - name: publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $repoUrl = "https://github.com/mila-desktop/desktop"
          $dlBase = "$repoUrl/releases/download/$tag"
          $files = Get-ChildItem -Path build/bin -File | Select-Object -ExpandProperty FullName
          $prevTag = (git tag --sort=-v:refname | Where-Object { $_ -ne $tag } | Select-Object -First 1)

          $tagNotes = (git tag -l --format='%(contents)' $tag) -join "`n"
          if (-not [string]::IsNullOrWhiteSpace($tagNotes) -and $tagNotes -match '(?m)^-\s') {
            $changes = $tagNotes.Trim()
          } else {
            $rawCommits = if ($prevTag) { git log "$prevTag..$tag" --no-merges --pretty=format:"%s" } else { git log -n 8 --no-merges --pretty=format:"%s" }
            $cleaned = foreach ($c in $rawCommits) {
              $line = ($c -replace '^[a-z]+(\([^)]+\))?:\s*', '' -replace '\s*\(v\d+\.\d+[^)]*\)\s*$', '').Trim()
              if ($line.Length -gt 0) {
                "- " + $line.Substring(0,1).ToUpper() + $line.Substring(1)
              }
            }
            $changes = ($cleaned -join "`n").Trim()
          }

          $header = @(
            "<p>"
            "  <a href=`"$dlBase/Mila-amd64-installer.exe`"><strong>Installer (.exe)</strong></a>"
            "  &nbsp;&nbsp;·&nbsp;&nbsp;"
            "  <a href=`"$dlBase/Mila-windows-amd64-$tag.zip`">Portable (.zip)</a>"
            "  &nbsp;&nbsp;·&nbsp;&nbsp;"
            "  <a href=`"$dlBase/Mila.exe`">Standalone Binary</a>"
            "  &nbsp;&nbsp;·&nbsp;&nbsp;"
            "  <a href=`"$dlBase/SHA256SUMS.txt`">SHA256</a>"
            "</p>"
            ""
            "### Changes"
            ""
            $changes
          )
          if ($prevTag) {
            $header += ""
            $header += "<sub><a href=`"$repoUrl/compare/$prevTag...$tag`">Compare $prevTag → $tag</a></sub>"
          }

          $notesFile = Join-Path $env:RUNNER_TEMP "release-notes.md"
          ($header -join "`n") | Set-Content -Path $notesFile -Encoding UTF8
          gh release create $tag $files --notes-file $notesFile --title "Mila $tag" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release edit $tag --notes-file $notesFile --title "Mila $tag" 2>$null
            gh release upload $tag $files --clobber
          }
