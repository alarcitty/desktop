name: Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: install frontend deps
        run: npm --prefix frontend ci

      - name: lint and check
        env:
          CGO_ENABLED: 0
        run: |
          npm --prefix frontend run check
          npm --prefix frontend run build
          go vet ./...

      - name: run tests
        env:
          CGO_ENABLED: 0
        run: |
          go test -count=1 ./internal/...
          npm --prefix frontend test

      - name: setup nsis
        uses: nsis-dev/setup-nsis@v1

      - name: install wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1

      - name: build app and installer
        env:
          CGO_ENABLED: 0
        run: wails build -platform windows/amd64 -nsis -ldflags "-s -w -extldflags '-static'"

      - name: package portable zip
        run: |
          $exe = Get-ChildItem -Path build/bin -Filter "*.exe" | Where-Object { $_.Name -notmatch "installer" } | Select-Object -First 1
          Compress-Archive -Path $exe.FullName -DestinationPath "build/bin/Mila-windows-amd64-${{ github.ref_name }}.zip"

      - name: publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = Get-ChildItem -Path build/bin -File | Select-Object -ExpandProperty FullName
          gh release create ${{ github.ref_name }} $files --generate-notes --title "Mila ${{ github.ref_name }}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release upload ${{ github.ref_name }} $files --clobber
          }
